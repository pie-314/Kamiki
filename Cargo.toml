[workspace]
members = [
    "kamiki-core",
    "kamiki-cli",
    "kamiki-tui",
    "kamiki-gui",
    "kamiki-web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "TBD"
authors = ["Aadarsh", "Rohit", "Shahbaz"]

[workspace.dependencies]
libbpf-rs = "0.26.2"

thiserror = "2.0.19"
anyhow = "1.0.104"

log = "0.4.33"
env_logger = "0.11.11"

crossbeam-channel = "0.5.16"
dashmap = "6.2.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

clap = { version = "4", features = ["derive"] }

ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

eframe = "0.35.0"
egui = "0.35.0"
